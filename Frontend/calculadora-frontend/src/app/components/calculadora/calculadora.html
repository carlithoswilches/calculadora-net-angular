<!-- Contenedor principal de toda la calculadora -->
<div class="calculadora-container">
  <h2>Calculadora</h2>

  <!-- Input donde el usuario escribe la expresión completa, ej: 3 + 5 * (2 - 8) -->
  <input
    type="text"
    class="expresion-input"
    placeholder="Escribe una expresión, ej: 3 + 5 * (2 - 8)"
  />

  <!-- Botón que más adelante disparará el cálculo (aún sin lógica) -->
  <button class="calcular-btn">Calcular</button>

  <!-- Zona donde luego se mostrará el resultado -->
  <div class="resultado-container">
    <span class="resultado-label">Resultado:</span>
    <span class="resultado-valor">-</span>
  </div>
</div>
